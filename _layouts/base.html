<!DOCTYPE html>
<html lang="{{language}}" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{title}}</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; form-action 'self' {{form_origin}}" />
    {{!primary}}
    <!-- Written out rather than left to ssg's {{!opengraph}} and {{!twitter}}
         blocks, which emit nothing here and let the post-processor derive the
         card text from the first 160 characters of the body — a sentence cut
         mid-word. These are the same words as the meta description, and
         og:type is website because this is the site root, not a post. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{name}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{permalink}}" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    {{!apple}}
    {{!microsoft}}
    <meta property="og:image" content="{{site_url}}images/passmcp-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{title}}" />
    <meta name="twitter:image" content="{{site_url}}images/passmcp-card.png" />
    <link rel="canonical" href="{{permalink}}" />
    <link rel="alternate" hreflang="{{language}}" href="{{permalink}}" />
    <link rel="alternate" hreflang="x-default" href="{{permalink}}" />
    <link rel="alternate" type="application/rss+xml" title="{{name}} — RSS" href="{{site_path}}rss.xml" />
    <link rel="manifest" href="{{site_path}}manifest.json" />
    <link rel="icon" href="{{site_path}}passmcp/favicon.ico" sizes="any" />
    <!-- A browser that understands SVG takes this one and scales it; the ico
         above carries 16, 32 and 48 for everything else. -->
    <link rel="icon" href="{{site_path}}passmcp/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="{{site_path}}passmcp/apple-touch-icon.png" />
    {{#if go_import}}<meta name="go-import" content="{{go_import}}" />
    <meta name="go-source" content="{{go_source}}" />{{/if}}
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="{{theme-color}}" />
    <meta name="view-transition" content="same-origin" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "{{site_url}}#website",
            "url": "{{site_url}}",
            "name": "{{name}}",
            "description": "{{description}}",
            "inLanguage": "{{language}}"
          },
          {
            "@type": "WebPage",
            "@id": "{{permalink}}#webpage",
            "url": "{{permalink}}",
            "name": "{{title}}",
            "description": "{{description}}",
            "inLanguage": "{{language}}",
            "isPartOf": { "@id": "{{site_url}}#website" },
            "datePublished": "{{date}}"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "{{site_url}}passmcp/#software",
            "name": "passmcp",
            "applicationCategory": "DeveloperApplication",
            "applicationSubCategory": "Testing and diagnostics",
            "operatingSystem": "macOS, Linux, Windows",
            "url": "{{site_url}}passmcp/",
            "downloadUrl": "https://github.com/sebastienrousseau/passmcp/releases/latest",
            "codeRepository": "https://github.com/sebastienrousseau/passmcp",
            "programmingLanguage": "Go",
            "license": "https://spdx.org/licenses/GPL-3.0-only.html",
            "description": "{{description}}",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "featureList": [
              "138 checks across nine phases",
              "Streamable HTTP, both protocol revisions including the stateless 2026-07-28 revision",
              "Runs locally so credentials never leave your trust boundary",
              "Every finding cites the request that produced it",
              "Text, Markdown, HTML, JSON, NDJSON, SARIF, JUnit and OCSF reports",
              "Exit codes and HAR archives for CI"
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "{{permalink}}#faq",
            "isPartOf": { "@id": "{{permalink}}#webpage" },
            "mainEntity": [
              { "@type": "Question", "name": "{{faq_one_q}}", "acceptedAnswer": { "@type": "Answer", "text": "{{faq_one_a}}" } },
              { "@type": "Question", "name": "{{faq_two_q}}", "acceptedAnswer": { "@type": "Answer", "text": "{{faq_two_a}}" } },
              { "@type": "Question", "name": "{{faq_three_q}}", "acceptedAnswer": { "@type": "Answer", "text": "{{faq_three_a}}" } },
              { "@type": "Question", "name": "{{faq_four_q}}", "acceptedAnswer": { "@type": "Answer", "text": "{{faq_four_a}}" } },
              { "@type": "Question", "name": "{{faq_five_q}}", "acceptedAnswer": { "@type": "Answer", "text": "{{faq_five_a}}" } },
              { "@type": "Question", "name": "{{faq_six_q}}", "acceptedAnswer": { "@type": "Answer", "text": "{{faq_six_a}}" } }
            ]
          }
        ]
      }
    </script>
    <!-- Skeletonic Stylus core, loaded before the theme's own
         stylesheet so its @layer skeletonic.* blocks are declared
         first and the theme wins every overlap. -->
    <link rel="stylesheet" href="{{site_path}}skeletonic.min.css" />
    <link rel="stylesheet" href="{{site_path}}styles.css" />
    <script src="{{site_path}}theme-init.js"></script>
  </head>
  <body class="{{theme_style}}">
    <a class="skip-link" href="#main">Skip to main content</a>
    {{> header}}
    <main id="main">{{#block "main"}}{{/block}}</main>
    {{> footer}}
    <script src="{{site_path}}main.js" defer></script>
  </body>
</html>
