<!-- The one Content-Security-Policy every page carries, the main site's
     and the passmcp-graph demo's: its own origin only. satellion.com runs
     no analytics (SECURITY.md, ADR 0003), so this deliberately blocks any
     script or beacon an edge proxy injects, Cloudflare's Web Analytics
     included, whatever the response header allows: a browser applies both
     policies. scripts/strict_csp.py holds every built page to it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; form-action 'self'" />
