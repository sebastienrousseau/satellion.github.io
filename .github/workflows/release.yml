# A release of satellion.com is a signed tag and its release page. There
# is no file to attach: the site deploys from main (pages.yml). This
# publishes the page beside the tag in the family's layout
# (scripts/release_page.py): the hand-written highlights from
# docs/releases/vX.Y.Z.md, GitHub's generated "What's Changed", the
# checksums section, which says what is published instead of files, and
# the full-changelog link. The page is read back before the job passes.
name: Release

on:
  push:
    tags: ["v*"]
  # Dry-run mode: verifies the versions and prints the page for the newest
  # CHANGELOG release, then stops short of publishing anything.
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Publish the release page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      # 3.12 is the floor README.md and DEVELOPMENT.md state.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The tag names a release on main, and every file that names the
      # version names this one. A dry run checks the newest CHANGELOG
      # release instead of a tag.
      - name: Resolve and verify the release
        id: ver
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = true ]; then
            tag="v$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p' CHANGELOG.md | head -n1)"
          else
            tag="${GITHUB_REF_NAME}"
            [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
            test "$(git rev-list -n 1 "${tag}")" = "${GITHUB_SHA}"
          fi
          scripts/verify-release-versions.sh "${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      # A dry run prints the page, placing a tag that does not exist yet
      # at this commit for GitHub's generated notes.
      - name: The release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          note="This release attaches no files: the site is deployed to https://satellion.com from this tag's tree."
          mode=(--publish)
          [ "${DRY_RUN}" != true ] || mode=(--target "${GITHUB_SHA}")
          python3 scripts/release_page.py "${mode[@]}" --note "${note}" "${TAG}"
