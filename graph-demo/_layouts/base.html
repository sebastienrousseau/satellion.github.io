<!DOCTYPE html>
<html lang="{{language}}" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{title}}</title>
    <!-- The site's policy, _layouts/csp.html, copied in by make graph-site. -->
    {{> csp}}
    {{!primary}}
    {{!opengraph}}
    {{!twitter}}
    {{!apple}}
    {{!microsoft}}
    <meta property="og:image" content="{{og_image}}" />
    <meta property="og:image:width" content="{{og_image_width}}" />
    <meta property="og:image:height" content="{{og_image_height}}" />
    <meta property="og:image:alt" content="{{og_image_alt}}" />
    <meta name="twitter:image" content="{{og_image}}" />
    <link rel="canonical" href="{{permalink}}" />
    <link rel="manifest" href="{{site_path}}manifest.json" />
    <link rel="icon" href="{{site_path}}favicon.ico" sizes="any" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="{{theme-color}}" />
    <meta name="view-transition" content="same-origin" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "{{site_url}}#website",
            "url": "{{site_url}}",
            "name": "{{name}}",
            "description": "{{description}}",
            "inLanguage": "{{language}}"
          },
          {
            "@type": "WebPage",
            "@id": "{{permalink}}#webpage",
            "url": "{{permalink}}",
            "name": "{{title}}",
            "description": "{{description}}",
            "inLanguage": "{{language}}",
            "isPartOf": { "@id": "{{site_url}}#website" },
            "datePublished": "{{date}}"
          }
        ]
      }
    </script>
    <!-- Skeletonic Stylus core, loaded before the theme's own
         stylesheet so its @layer skeletonic.* blocks are declared
         first and the theme wins every overlap. -->
    <link rel="stylesheet" href="{{site_path}}skeletonic.min.css" />
    <link rel="stylesheet" href="{{site_path}}styles.css" />
    <script src="{{site_path}}theme-init.js"></script>
  </head>
  <body class="{{theme_style}}">
    <a class="skip-link" href="#main">{{label_skip}}</a>
    <!-- The app shell: a sidebar column beside the header, main and footer
         column. header.html emits both the top bar and the sidebar, so this
         file stays the only document shell. -->
    <div class="cc-app">
      {{> header}}
      <main id="main" class="cc-main">{{#block "main"}}{{/block}}</main>
      {{> footer}}
    </div>
    <script src="{{site_path}}main.js" defer></script>
  </body>
</html>
