<footer class="site-footer cc-foot" id="contact">
  <div class="footer-grid">
    <div>
      <span class="brand footer-brand"><span class="brand-mark" aria-hidden="true">{{brand_mark}}</span><span>{{name}}</span></span>
      <p>{{footer_note}}</p>
    </div>
    <div>
      <h2>{{label_explore}}</h2>
      <ul>
        <li><a href="{{locale_path}}#findings">{{nav_findings}}</a></li>
        <li><a href="{{locale_path}}#servers">{{nav_servers}}</a></li>
        <li><a href="{{about_href}}">{{nav_about}}</a></li>
        <li><a href="{{contact_href}}">{{nav_contact}}</a></li>
      </ul>
    </div>
    <div>
      <h2>{{label_start}}</h2>
      <p><a class="footer-action" href="{{report_href}}" rel="noopener">{{report_label}}</a></p>
      <p class="fine-print">© {{copyright_year}} <a href="https://sebastienrousseau.com/" rel="author">Sebastien Rousseau</a>. {{label_demo_content}}</p>
      <p class="fine-print footer-credit">Made with ❤️ in London. Built with <a class="made-with-ssg" href="https://static-site-generator.com/">SSG</a> and <a href="https://skeletonic.com/">Skeletonic CSS</a>.</p>
    </div>
  </div>
</footer>
