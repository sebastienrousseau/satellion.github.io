# SPDX-License-Identifier: GPL-3.0-only

version = 1
SPDX-PackageName = "satellion.com"
SPDX-PackageSupplier = "Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/sebastienrousseau/satellion.github.io"

# Images and formats that take no comment.
[[annotations]]
path = ["images/**", ".gitignore", ".github/demo.gif"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# The layouts are vendored from the passmcp theme in the SSG theme suite
# (github.com/sebastienrousseau/ssg-themes.github.io), whose theme.json
# declares MIT, as they were in passmcp's repository. "override" because the
# footers render a copyright line for the site they build, which is page
# text about passmcp, not a notice about the template.
[[annotations]]
path = ["_layouts/**"]
precedence = "override"
SPDX-FileCopyrightText = "2024 - 2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "MIT"

# The site's one Content-Security-Policy, written for this site, not
# vendored: GPL-3.0-only like the rest of the repository.
[[annotations]]
path = ["_layouts/csp.html"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# The passmcp-graph demo's layouts are vendored from the Control Centre
# theme in the SSG theme suite: themes/control-centre/_layouts/ of
# github.com/sebastienrousseau/ssg-themes.github.io, whose theme.json and
# theme.toml declare MIT. Copied on 2026-10-18 from a working tree at
# commit 22b5dbbaa63c02e0b3c8b7a1cb630664e9f99c7c, where the theme was not
# yet committed; scripts/test_graph_demo.py pins the unchanged files to
# that copy by SHA-256. base.html (the site's CSP partial, the og:image
# fields, no feed links), header.html (one locale, links to satellion's
# pages), footer.html (the owner's copyright line, no example address)
# and index.html (places the export leaves empty are left out) are
# adapted; their headers say so where the change is not obvious.
[[annotations]]
path = ["graph-demo/_layouts/**"]
precedence = "override"
SPDX-FileCopyrightText = "2024 - 2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "MIT"

# passmcp's icons, copied from passmcp's brand/ at the release the site is
# built against, under passmcp's licence.
[[annotations]]
path = ["brand/passmcp/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# The Satellion logo, the lion and the wordmark, published under the site's
# licence. A copyright licence only: the name and the marks are not licensed.
[[annotations]]
path = ["brand/satellion/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"
